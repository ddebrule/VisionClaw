name: Build Scout_IQ IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Inject Secrets.swift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPECTRE_TTS_URL: ${{ secrets.SPECTRE_TTS_URL }}
          SPECTRE_SCOUT_URL: ${{ secrets.SPECTRE_SCOUT_URL }}
          SPECTRE_USER_TOKEN: ${{ secrets.SPECTRE_USER_TOKEN }}
        run: |
          cat > samples/CameraAccess/CameraAccess/Secrets.swift << EOF
          import Foundation

          enum Secrets {
            static let geminiAPIKey = "$GEMINI_API_KEY"
            static let spectreTTSURL = "$SPECTRE_TTS_URL"
            static let spectreScoutURL = "$SPECTRE_SCOUT_URL"
            static let spectreUserToken = "$SPECTRE_USER_TOKEN"
            static let openClawHost = "http://localhost"
            static let openClawPort = 18789
            static let openClawHookToken = ""
            static let openClawGatewayToken = ""
            static let webrtcSignalingURL = "ws://localhost:8080"
          }
          EOF

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/ScoutIQ.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA (unsigned)
        run: |
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -r "$RUNNER_TEMP/ScoutIQ.xcarchive/Products/Applications/CameraAccess.app" \
            "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r ScoutIQ.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScoutIQ-${{ github.sha }}
          path: ${{ runner.temp }}/ipa/ScoutIQ.ipa
          retention-days: 30
