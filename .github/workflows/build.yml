name: Build Scout_IQ IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Inject Secrets.swift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPECTRE_TTS_URL: ${{ secrets.SPECTRE_TTS_URL }}
          SPECTRE_SCOUT_URL: ${{ secrets.SPECTRE_SCOUT_URL }}
          SPECTRE_USER_TOKEN: ${{ secrets.SPECTRE_USER_TOKEN }}
        run: |
          cat > samples/CameraAccess/CameraAccess/Secrets.swift << EOF
          import Foundation

          enum Secrets {
            static let geminiAPIKey = "$GEMINI_API_KEY"
            static let spectreTTSURL = "$SPECTRE_TTS_URL"
            static let spectreScoutURL = "$SPECTRE_SCOUT_URL"
            static let spectreUserToken = "$SPECTRE_USER_TOKEN"
            static let openClawHost = "http://localhost"
            static let openClawPort = 18789
            static let openClawHookToken = ""
            static let openClawGatewayToken = ""
            static let webrtcSignalingURL = "ws://localhost:8080"
          }
          EOF

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/ScoutIQ.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/ScoutIQ.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScoutIQ-${{ github.sha }}
          path: $RUNNER_TEMP/ipa/*.ipa
          retention-days: 30
